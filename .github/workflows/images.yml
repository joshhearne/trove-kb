name: Images

# Builds the app image that Docker installs run, and publishes it to GHCR.
# The host updater (updater/trove-kb-update.sh) pins each install to one of
# these exact tags:
#
#   push to dev       -> trove-kb:dev-<sha7>  (+ floating :dev)
#   tag vX.Y.Z        -> trove-kb:vX.Y.Z      (+ floating :stable)
#   tag vX.Y.Z-rc.N   -> trove-kb:vX.Y.Z-rc.N (pre-release, no :stable)
#
# Each architecture builds on a runner of its own kind. A Next.js build under
# QEMU emulation takes hours, when it finishes at all. The two images are
# pushed by digest, then joined under the tags as one multi-arch image.
#
# Publishing the tags goes through a GitHub Environment (development /
# production), so that environment's protection rules gate who can publish.

on:
  push:
    branches: [dev]
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: images-${{ github.ref }}
  # A newer dev push supersedes an unpublished build; a release always finishes.
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  meta:
    name: Work out tags
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.image }}
      version: ${{ steps.meta.outputs.version }}
      tags: ${{ steps.meta.outputs.tags }}
      built_at: ${{ steps.meta.outputs.built_at }}
    steps:
      - id: meta
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/trove-kb"
          SHORT="${GITHUB_SHA::7}"
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            VERSION="$GITHUB_REF_NAME"
            TAGS="$IMAGE:$VERSION"
            # Only full releases move :stable; release candidates don't.
            case "$VERSION" in *-*) ;; *) TAGS="$TAGS $IMAGE:stable" ;; esac
          else
            VERSION="dev-$SHORT"
            TAGS="$IMAGE:$VERSION $IMAGE:dev"
          fi
          {
            echo "image=$IMAGE"
            echo "version=$VERSION"
            echo "tags=$TAGS"
            echo "built_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.arch }}
    needs: meta
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Pushed by digest only; the publish job puts the tags on.
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ needs.meta.outputs.image }},push-by-digest=true,name-canonical=true,push=true
          build-args: |
            TROVE_BUILD_VERSION=${{ needs.meta.outputs.version }}
            TROVE_BUILD_COMMIT=${{ github.sha }}
            TROVE_BUILT_AT=${{ needs.meta.outputs.built_at }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.meta.outputs.version }}
            org.opencontainers.image.licenses=AGPL-3.0-or-later
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}

      - name: Keep the digest
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}

      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.arch }}
          path: /tmp/digests/*
          retention-days: 1

  publish:
    name: Publish trove-kb
    needs: [meta, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: ${{ github.ref_type == 'tag' && 'production' || 'development' }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: digest-*
          path: /tmp/digests
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag the multi-arch image
        working-directory: /tmp/digests
        env:
          IMAGE: ${{ needs.meta.outputs.image }}
          TAGS: ${{ needs.meta.outputs.tags }}
        run: |
          set -euo pipefail
          args=()
          for tag in $TAGS; do args+=(-t "$tag"); done
          sources=()
          for digest in *; do sources+=("$IMAGE@sha256:$digest"); done
          docker buildx imagetools create "${args[@]}" "${sources[@]}"
          docker buildx imagetools inspect "${TAGS%% *}"
