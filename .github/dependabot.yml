# Dependabot version updates. PRs go into dev, like all other work; main is
# released code only. GitHub reads this file from the default branch (main),
# so it takes effect once a release moves main past the commit that adds it. Minor and patch bumps are grouped into one PR per
# ecosystem; major bumps arrive one per PR so each can be reviewed alone.
version: 2

updates:
  - package-ecosystem: npm
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
    # Framework majors are planned upgrades, not weekly bumps (as in Resolvd).
    ignore:
      - dependency-name: next
        update-types: ["version-update:semver-major"]
      - dependency-name: eslint-config-next
        update-types: ["version-update:semver-major"]
      - dependency-name: react
        update-types: ["version-update:semver-major"]
      - dependency-name: react-dom
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react-dom"
        update-types: ["version-update:semver-major"]
      - dependency-name: tailwindcss
        update-types: ["version-update:semver-major"]
      - dependency-name: "@tailwindcss/postcss"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@tiptap/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: better-auth
        update-types: ["version-update:semver-major"]
      # Held until the tooling catches up: eslint 10 breaks eslint-config-next's
      # bundled eslint-plugin-react, and typescript-eslint refuses TypeScript 7.
      # Lift each when a Next release supports it.
      - dependency-name: eslint
        update-types: ["version-update:semver-major"]
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      # unpdf 2 needs Node 24; the images run node:22. Lift with the Node upgrade.
      - dependency-name: unpdf
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "deps"

  # node:22-alpine in both images. Node majors are a deliberate upgrade,
  # not a weekly bump, so only minor/patch digests are proposed.
  - package-ecosystem: docker
    directories:
      - /
      - /docker/bw-serve
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
    ignore:
      - dependency-name: node
        update-types: [version-update:semver-major]
    commit-message:
      prefix: "deps(docker)"

  # postgres:16-alpine in docker-compose.yml. A Postgres major needs a dump and
  # restore, so only minor/patch tags are proposed. The 1Password Connect
  # images are pinned to :latest and have nothing to bump.
  - package-ecosystem: docker-compose
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
    ignore:
      - dependency-name: postgres
        update-types: [version-update:semver-major]
    commit-message:
      prefix: "deps(docker)"

  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "deps(actions)"
